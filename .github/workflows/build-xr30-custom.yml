name: XR30 eMMC - Custom ImmortalWrt (unverified)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Choose profile; run baseline first'
        required: true
        type: choice
        options:
          - baseline
          - performance
          - full
        default: baseline
      source_ref:
        description: 'hanwckf openwrt-21.02 branch or audited commit SHA'
        type: string
        required: true
        default: 'openwrt-21.02'
      lan_ip:
        description: 'Default LAN IP (patched into config_generate at build time)'
        type: string
        required: true
        default: '192.168.2.1'

permissions:
  contents: read

concurrency:
  group: xr30-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile ${{ inputs.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai
      PROFILE: ${{ inputs.profile }}
      SOURCE_REF: ${{ inputs.source_ref }}
      LAN_IP: ${{ inputs.lan_ip }}
    steps:
      - name: Checkout own fork / overlay
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git gawk gettext flex bison cmake ccache \
            gcc-multilib g++-multilib libncurses-dev zlib1g-dev \
            libssl-dev libelf-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools unzip rsync \
            curl wget file subversion swig time perl \
            tar xz-utils zstd device-tree-compiler

      - name: Clone hanwckf source
        run: |
          set -euo pipefail
          git clone --depth=1 --branch openwrt-21.02 \
            https://github.com/hanwckf/immortalwrt-mt798x.git openwrt
          if [ "$SOURCE_REF" != 'openwrt-21.02' ]; then
            git -C openwrt fetch --depth=1 origin "$SOURCE_REF"
            git -C openwrt checkout --detach FETCH_HEAD
          fi
          echo "Source: $(git -C openwrt rev-parse HEAD)"

      - name: Prepare third-party packages (no changes to router)
        run: |
          bash scripts/custom_prepare.sh "$PROFILE" "$GITHUB_WORKSPACE/openwrt"

      - name: Update and install package feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ "$PROFILE" = 'full' ]; then
            ./scripts/feeds install -d y -p istore luci-app-store
          fi

      - name: Deduplicate OpenClash package source
        if: inputs.profile != 'baseline'
        run: |
          set -euo pipefail
          # The luci feed already ships an older luci-app-openclash. Keep the
          # upstream clone prepared by scripts/custom_prepare.sh and drop the
          # feed copy so the package name is defined exactly once.
          rm -rf openwrt/feeds/luci/applications/luci-app-openclash
          rm -rf openwrt/package/feeds/luci/luci-app-openclash
          test -s openwrt/package/luci-app-openclash/Makefile

      - name: Record package feed revisions
        run: |
          set -euo pipefail
          : > feeds-shas.txt
          for dir in openwrt/feeds/*; do
            [ -d "$dir/.git" ] || continue
            printf '%s %s\n' "$(basename "$dir")" "$(git -C "$dir" rev-parse HEAD)" >> feeds-shas.txt
          done
          sort -o feeds-shas.txt feeds-shas.txt
          cat feeds-shas.txt

      - name: Apply XR30 LED patch (required)
        run: |
          set -euo pipefail
          DTS='openwrt/target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-cmcc-rax3000m.dtsi'
          EMMC_DTS='openwrt/target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-cmcc-rax3000m-emmc.dts'
          test -s mt7981-cmcc-xr30-emmc.dtsi
          test -f "$DTS"
          test -f "$EMMC_DTS"
          # New hanwckf DTSI is refactored: patch only LED GPIO and aliases.
          # Old inline DTSI receives author's original XR30 adaptation.
          python3 scripts/patch_led.py "$DTS" mt7981-cmcc-xr30-emmc.dtsi
          # Fail closed if upstream no longer has the known 26MHz field.
          grep -Eq 'max-frequency[[:space:]]*=[[:space:]]*<26000000>;' "$EMMC_DTS" \
            || { echo 'ERROR: eMMC DTS does not show 26MHz. Review before continuing.'; exit 1; }
          grep -n 'max-frequency' "$EMMC_DTS"

      - name: Apply default LAN IP (fail-closed)
        run: |
          set -euo pipefail
          CFG='openwrt/package/base-files/files/bin/config_generate'
          test -f "$CFG"
          # Validate dotted-quad to keep sed injection impossible
          [[ "$LAN_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "ERROR: invalid LAN_IP '$LAN_IP'"; exit 1; }
          IFS=. read -r o1 o2 o3 o4 <<< "$LAN_IP"
          for o in "$o1" "$o2" "$o3" "$o4"; do
            [ "$o" -le 255 ] || { echo "ERROR: LAN_IP octet > 255: '$LAN_IP'"; exit 1; }
          done
          grep -q '192\.168\.1\.1' "$CFG" || { echo 'ERROR: default LAN IP anchor not found; upstream drifted, manual audit required'; exit 1; }
          sed -i "s/192\.168\.1\.1/${LAN_IP}/g" "$CFG"
          grep -q "ipad=.*${LAN_IP}" "$CFG" || { echo 'ERROR: LAN IP patch verification failed'; exit 1; }
          if grep -q '192\.168\.1\.1' "$CFG"; then echo 'ERROR: old LAN IP still present'; exit 1; fi
          echo "Default LAN IP set to ${LAN_IP}"
          echo "${LAN_IP}" > lan-ip.txt

      - name: Verify third-party and in-tree package sources
        run: |
          set -euo pipefail
          # In-tree Lua/CBI Tailscale page must exist and stay Lua-only:
          # this firmware ships the Lua-based LuCI from 21.02, which cannot
          # render the JS views used by upstream luci-app-tailscale.
          test -s openwrt/package/luci-app-tailscale-lite/Makefile
          test -s openwrt/package/luci-app-tailscale-lite/luasrc/controller/tailscale.lua
          test -s openwrt/package/luci-app-tailscale-lite/luasrc/model/cbi/tailscale/status.lua
          if find openwrt/package/luci-app-tailscale-lite -name '*.js' | grep -q .; then
            echo 'ERROR: luci-app-tailscale-lite must stay Lua-only on 21.02'; exit 1
          fi
          grep -q 'require "luci.jsonc"' openwrt/package/luci-app-tailscale-lite/luasrc/model/cbi/tailscale/status.lua
          if [ "$PROFILE" = 'full' ]; then
            test -s openwrt/package/luci-app-adguardhome/Makefile
            test -d openwrt/package/luci-app-adguardhome/luasrc
            # Its menu must stay CBI/form based. A switch to "view" (JS) would
            # mean the package moved to 22.03+ and would render blank here.
            test -s openwrt/package/luci-app-adguardhome/root/usr/share/luci/menu.d/luci-app-adguardhome.json
            if grep -q '"type": *"view"' openwrt/package/luci-app-adguardhome/root/usr/share/luci/menu.d/luci-app-adguardhome.json; then
              echo 'ERROR: luci-app-adguardhome menu became JS-view; incompatible with 21.02'; exit 1
            fi
            grep -q '"type": *"cbi"' openwrt/package/luci-app-adguardhome/root/usr/share/luci/menu.d/luci-app-adguardhome.json
            # The pinned commit must publish the INCLUDE_binary switch we rely
            # on to avoid shipping a second AdGuard Home binary.
            grep -q 'INCLUDE_binary' openwrt/package/luci-app-adguardhome/Makefile
          fi
          echo 'OK: package sources verified for the 21.02 Lua LuCI'

      - name: Generate profile config
        run: |
          python3 scripts/configure.py \
            --base configs/rax3000z-emmc.config \
            --output openwrt/.config \
            --profile "$PROFILE"
          make -C openwrt defconfig
          python3 scripts/configure.py \
            --verify openwrt/.config \
            --profile "$PROFILE"
          cp openwrt/.config selected-config.txt
          git -C openwrt rev-parse HEAD > upstream-source-sha.txt

      - name: Download dependencies
        working-directory: openwrt
        run: |
          make download -j8 V=s

      - name: Compile firmware (fail on errors)
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s

      - name: Verify and inventory images
        run: |
          python3 scripts/verify_images.py openwrt/bin/targets/mediatek/mt7981

      - name: Upload build result and evidence (NOT an endorsement for flashing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr30-${{ inputs.profile }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            openwrt/bin/targets/mediatek/mt7981/
            selected-config.txt
            upstream-source-sha.txt
            feeds-shas.txt
            openwrt/openclash-source-sha.txt
            image-inventory.txt
            lan-ip.txt
            openwrt/kenzok8-source-sha.txt
