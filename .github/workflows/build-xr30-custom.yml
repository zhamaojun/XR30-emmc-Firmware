name: XR30 eMMC - Custom ImmortalWrt (unverified)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Choose profile; run baseline first'
        required: true
        type: choice
        options:
          - baseline
          - performance
          - full
        default: baseline
      source_ref:
        description: 'hanwckf openwrt-21.02 audited commit SHA (branch names drift)'
        type: string
        required: true
        default: '740103d655bcee6da7bc3b49b1cfdfdee4cd5bb6'
      lan_ip:
        description: 'Default LAN IP (patched into config_generate at build time)'
        type: string
        required: true
        default: '192.168.2.1'

permissions:
  contents: read

concurrency:
  group: xr30-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile ${{ inputs.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai
      PROFILE: ${{ inputs.profile }}
      SOURCE_REF: ${{ inputs.source_ref }}
      LAN_IP: ${{ inputs.lan_ip }}
    steps:
      - name: Checkout own fork / overlay
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git gawk gettext flex bison cmake ccache \
            gcc-multilib g++-multilib libncurses-dev zlib1g-dev \
            libssl-dev libelf-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools unzip rsync \
            curl wget file subversion swig time perl \
            tar xz-utils zstd device-tree-compiler

      - name: Clone hanwckf source
        run: |
          set -euo pipefail
          # Fetch the pinned commit directly. The branch head moves, so a
          # branch name would make every build different.
          git init openwrt
          git -C openwrt remote add origin https://github.com/hanwckf/immortalwrt-mt798x.git
          git -C openwrt fetch --depth=1 origin "$SOURCE_REF"
          git -C openwrt checkout --detach FETCH_HEAD
          echo "Source: $(git -C openwrt rev-parse HEAD)"

      - name: Prepare third-party packages (no changes to router)
        run: |
          bash scripts/custom_prepare.sh "$PROFILE" "$GITHUB_WORKSPACE/openwrt"

      - name: Update and install package feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ "$PROFILE" = 'full' ]; then
            ./scripts/feeds install -d y -p istore luci-app-store
          fi

      - name: Deduplicate OpenClash package source
        if: inputs.profile != 'baseline'
        run: |
          set -euo pipefail
          # The luci feed already ships an older luci-app-openclash. Keep the
          # upstream clone prepared by scripts/custom_prepare.sh and drop the
          # feed copy so the package name is defined exactly once.
          rm -rf openwrt/feeds/luci/applications/luci-app-openclash
          rm -rf openwrt/package/feeds/luci/luci-app-openclash
          test -s openwrt/package/luci-app-openclash/Makefile

      - name: Record package feed revisions
        run: |
          set -euo pipefail
          : > feeds-shas.txt
          for dir in openwrt/feeds/*; do
            [ -d "$dir/.git" ] || continue
            printf '%s %s\n' "$(basename "$dir")" "$(git -C "$dir" rev-parse HEAD)" >> feeds-shas.txt
          done
          sort -o feeds-shas.txt feeds-shas.txt
          cat feeds-shas.txt

      - name: Apply XR30 target patches (native LEDs, eMMC pinned to 26MHz)
        run: |
          set -euo pipefail
          # Upstream's native cmcc_xr30-emmc target already carries the XR30
          # white LED on GPIO34, so the old LED patch is no longer used (it is
          # kept in-tree for rollback to the legacy target). Its stock DTS runs
          # the eMMC at 52 MHz; the author warns that can mean I/O errors or a
          # non-booting device, so pin 26 MHz and fail closed on surprises.
          DTS='openwrt/target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-cmcc-xr30-emmc.dts'
          DTSI='openwrt/target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-cmcc-xr30.dtsi'
          test -f "$DTS"
          test -f "$DTSI"
          python3 scripts/patch_xr30_target.py "$DTS" "$DTSI"
          grep -q 'max-frequency = <26000000>;' "$DTS"
          if grep -q '52000000' "$DTS"; then echo 'ERROR: 52 MHz still present'; exit 1; fi
          grep -q 'gpios = <&pio 34 GPIO_ACTIVE_LOW>;' "$DTSI"
          grep -n 'max-frequency' "$DTS"
          grep -n 'white_led' "$DTSI"

      - name: Apply default LAN IP (fail-closed)
        run: |
          set -euo pipefail
          CFG='openwrt/package/base-files/files/bin/config_generate'
          test -f "$CFG"
          # Validate dotted-quad to keep sed injection impossible
          [[ "$LAN_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "ERROR: invalid LAN_IP '$LAN_IP'"; exit 1; }
          IFS=. read -r o1 o2 o3 o4 <<< "$LAN_IP"
          for o in "$o1" "$o2" "$o3" "$o4"; do
            [ "$o" -le 255 ] || { echo "ERROR: LAN_IP octet > 255: '$LAN_IP'"; exit 1; }
          done
          grep -q '192\.168\.1\.1' "$CFG" || { echo 'ERROR: default LAN IP anchor not found; upstream drifted, manual audit required'; exit 1; }
          sed -i "s/192\.168\.1\.1/${LAN_IP}/g" "$CFG"
          grep -q "ipad=.*${LAN_IP}" "$CFG" || { echo 'ERROR: LAN IP patch verification failed'; exit 1; }
          if grep -q '192\.168\.1\.1' "$CFG"; then echo 'ERROR: old LAN IP still present'; exit 1; fi
          echo "Default LAN IP set to ${LAN_IP}"
          echo "${LAN_IP}" > lan-ip.txt

      - name: Verify third-party and in-tree package sources
        run: |
          set -euo pipefail
          # In-tree Lua/CBI Tailscale page must exist and stay Lua-only:
          # this firmware ships the Lua-based LuCI from 21.02, which cannot
          # render the JS views used by upstream luci-app-tailscale.
          test -s openwrt/package/luci-app-tailscale-lite/Makefile
          test -s openwrt/package/luci-app-tailscale-lite/luasrc/controller/tailscale.lua
          test -s openwrt/package/luci-app-tailscale-lite/luasrc/model/cbi/tailscale/status.lua
          if find openwrt/package/luci-app-tailscale-lite -name '*.js' | grep -q .; then
            echo 'ERROR: luci-app-tailscale-lite must stay Lua-only on 21.02'; exit 1
          fi
          grep -q 'require "luci.jsonc"' openwrt/package/luci-app-tailscale-lite/luasrc/model/cbi/tailscale/status.lua
          # Reversible network-defaults package must be present and documented.
          test -s openwrt/package/xr30-network-tuning/Makefile
          test -s openwrt/package/xr30-network-tuning/files/etc/uci-defaults/99-xr30-network-tuning
          test -s openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload
          if grep -qE 'flow_offloading|tcp_fastopen' openwrt/package/xr30-network-tuning/files/etc/uci-defaults/99-xr30-network-tuning; then
            echo 'ERROR: tuning package must not touch flow-offload or TFO'; exit 1
          fi
          # sch_fq is not built into this kernel; fq_codel is the default.
          if grep -q 'net.core.default_qdisc = fq$' openwrt/package/xr30-network-tuning/files/etc/uci-defaults/99-xr30-network-tuning; then
            echo 'ERROR: default_qdisc=fq is not supported (CONFIG_NET_SCH_FQ not set)'; exit 1
          fi
          # Owner decision 2026-11-21: full speed over shaping. HNAT stays on
          # with every sub-option turboacc would have chosen itself, and SQM
          # ships configured but disabled so LuCI's Enable works first time.
          grep -q "set sqm.wan.qdisc='cake'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload
          grep -q "set sqm.wan.enabled='0'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload
          if grep -q "set sqm.wan.enabled='1'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload; then
            echo 'ERROR: shaping must not be enabled by default'; exit 1
          fi
          grep -q "set turboacc.config.fastpath='mediatek_hnat'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload
          grep -q "set turboacc.config.fastpath_mh_eth_hnat='1'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload
          if grep -q "fastpath='disabled'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload; then
            echo 'ERROR: HNAT must stay on; disabling it costs line speed for nothing'; exit 1
          fi
          if grep -q "fastpath='none'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload; then
            echo "ERROR: TurboACC fastpath has no 'none' value; use 'disabled'"; exit 1
          fi
          grep -q "set turboacc.config.tcpcca='bbr'" openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload
          # luci-app-turboacc-mtk ships uci-defaults/turboacc, which rewrites
          # /etc/config/turboacc wholesale and picks fastpath=mediatek_hnat.
          # Letters sort after digits, so it used to reset tcpcca to cubic on the
          # first boot. It bails out on turboacc.global.set=1: that line must
          # exist and must come before any other turboacc write.
          GL_SCRIPT=openwrt/package/xr30-network-tuning/files/etc/uci-defaults/97-xr30-hardware-offload
          grep -q "set turboacc.global.set='1'" "$GL_SCRIPT"
          guard_line=$(grep -n "set turboacc.global.set='1'" "$GL_SCRIPT" | head -1 | cut -d: -f1)
          first_cfg_line=$(grep -n 'set turboacc\.config\.' "$GL_SCRIPT" | head -1 | cut -d: -f1)
          if [ -z "$guard_line" ] || [ -z "$first_cfg_line" ] || [ "$guard_line" -ge "$first_cfg_line" ]; then
            echo 'ERROR: turboacc.global.set=1 must be set before turboacc.config.* writes'; exit 1
          fi
          grep -q 'set ucitrack.@turboacc\[-1\].init=turboacc' "$GL_SCRIPT"
          # PPPoE needs pppoe-wan + overhead 8, else the shaper sits on the
          # wrong device and CAKE underestimates the wire rate.
          grep -q 'WAN_DEV="pppoe-wan"' "$GL_SCRIPT"
          grep -q "set sqm.wan.overhead='\$OVERHEAD'" "$GL_SCRIPT"
          if grep -q "set sqm.wan.overhead='0'" "$GL_SCRIPT"; then
            echo 'ERROR: SQM overhead must come from the detected WAN proto'; exit 1
          fi
          # Docker must stay out of every profile (br_netfilter hurts bridging).
          if grep -qE '^\s*"(docker|dockerd|luci-app-dockerman|luci-lib-docker)"' scripts/configure.py \
             && ! grep -q '"docker", "dockerd"' scripts/configure.py; then
            echo 'ERROR: docker selection state is inconsistent in configure.py'; exit 1
          fi
          if [ "$PROFILE" = 'full' ]; then
            test -s openwrt/package/luci-app-adguardhome/Makefile
            test -d openwrt/package/luci-app-adguardhome/luasrc
            # Its menu must stay CBI/form based. A switch to "view" (JS) would
            # mean the package moved to 22.03+ and would render blank here.
            test -s openwrt/package/luci-app-adguardhome/root/usr/share/luci/menu.d/luci-app-adguardhome.json
            if grep -q '"type": *"view"' openwrt/package/luci-app-adguardhome/root/usr/share/luci/menu.d/luci-app-adguardhome.json; then
              echo 'ERROR: luci-app-adguardhome menu became JS-view; incompatible with 21.02'; exit 1
            fi
            grep -q '"type": *"cbi"' openwrt/package/luci-app-adguardhome/root/usr/share/luci/menu.d/luci-app-adguardhome.json
            # The pinned commit must publish the INCLUDE_binary switch we rely
            # on to avoid shipping a second AdGuard Home binary.
            grep -q 'INCLUDE_binary' openwrt/package/luci-app-adguardhome/Makefile
          fi
          echo 'OK: package sources verified for the 21.02 Lua LuCI'

      - name: Generate profile config
        run: |
          python3 scripts/configure.py \
            --base configs/rax3000z-emmc.config \
            --output openwrt/.config \
            --profile "$PROFILE"
          make -C openwrt defconfig
          python3 scripts/configure.py \
            --verify openwrt/.config \
            --profile "$PROFILE"
          cp openwrt/.config selected-config.txt
          git -C openwrt rev-parse HEAD > upstream-source-sha.txt

      - name: Download dependencies
        working-directory: openwrt
        run: |
          make download -j8 V=s

      - name: Compile firmware (fail on errors)
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s

      - name: Verify and inventory images
        run: |
          python3 scripts/verify_images.py openwrt/bin/targets/mediatek/mt7981

      - name: Upload build result and evidence (NOT an endorsement for flashing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr30-${{ inputs.profile }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            openwrt/bin/targets/mediatek/mt7981/
            selected-config.txt
            upstream-source-sha.txt
            feeds-shas.txt
            openwrt/openclash-source-sha.txt
            image-inventory.txt
            lan-ip.txt
            openwrt/kenzok8-source-sha.txt
